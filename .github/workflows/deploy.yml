name: Deploy

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.SERVICE_NAME }}

jobs:
  validate:
    name: Validate Variables
    runs-on: ubuntu-latest
    steps:
      - name: Check required variables
        env:
          SECRET_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SECRET_VM_HOST: ${{ secrets.VM_HOST }}
          SECRET_VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "=== Variables ==="
          echo "GAR_LOCATION     : ${{ vars.GAR_LOCATION }}"
          echo "GCP_PROJECT_ID   : ${{ vars.GCP_PROJECT_ID }}"
          echo "GAR_REPOSITORY   : ${{ vars.GAR_REPOSITORY }}"
          echo "SERVICE_NAME     : ${{ vars.SERVICE_NAME }}"
          echo "VM_USER          : ${{ vars.VM_USER }}"
          echo "VM_SSH_PORT      : ${{ vars.VM_SSH_PORT }}"
          echo "APP_DIR          : ${{ vars.APP_DIR }}"
          echo "HEALTH_CHECK_PORT: ${{ vars.HEALTH_CHECK_PORT }}"
          echo ""
          echo "=== Secrets (존재 여부만 확인) ==="
          [ -n "$SECRET_GCP_SA_KEY" ] && echo "GCP_SA_KEY  : ✅" || echo "GCP_SA_KEY  : ❌ 누락"
          [ -n "$SECRET_VM_HOST"    ] && echo "VM_HOST     : ✅" || echo "VM_HOST     : ❌ 누락"
          [ -n "$SECRET_VM_SSH_KEY" ] && echo "VM_SSH_KEY  : ✅" || echo "VM_SSH_KEY  : ❌ 누락"
          echo ""

          MISSING=()
          [ -z "${{ vars.GAR_LOCATION }}"      ] && MISSING+=("vars.GAR_LOCATION")
          [ -z "${{ vars.GCP_PROJECT_ID }}"    ] && MISSING+=("vars.GCP_PROJECT_ID")
          [ -z "${{ vars.GAR_REPOSITORY }}"    ] && MISSING+=("vars.GAR_REPOSITORY")
          [ -z "${{ vars.SERVICE_NAME }}"      ] && MISSING+=("vars.SERVICE_NAME")
          [ -z "${{ vars.VM_USER }}"           ] && MISSING+=("vars.VM_USER")
          [ -z "${{ vars.VM_SSH_PORT }}"       ] && MISSING+=("vars.VM_SSH_PORT")
          [ -z "${{ vars.APP_DIR }}"           ] && MISSING+=("vars.APP_DIR")
          [ -z "${{ vars.HEALTH_CHECK_PORT }}" ] && MISSING+=("vars.HEALTH_CHECK_PORT")
          [ -z "$SECRET_GCP_SA_KEY"            ] && MISSING+=("secrets.GCP_SA_KEY")
          [ -z "$SECRET_VM_HOST"               ] && MISSING+=("secrets.VM_HOST")
          [ -z "$SECRET_VM_SSH_KEY"            ] && MISSING+=("secrets.VM_SSH_KEY")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "=== 누락된 변수 ==="
            for var in "${MISSING[@]}"; do
              echo "  ❌ $var"
            done
            exit 1
          fi

          echo "=== 모든 변수 확인 완료 ✅ ==="

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test \
            -PGitHubPackagesUsername=${{ github.actor }} \
            -PGitHubPackagesPassword=${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test \
            -PGitHubPackagesUsername=${{ github.actor }} \
            -PGitHubPackagesPassword=${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.VM_USER }}
          port: ${{ vars.VM_SSH_PORT }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ vars.APP_DIR }}"
            SERVICE="${{ vars.SERVICE_NAME }}"
            NEW_TAG="${{ github.sha }}"
            IMAGE="${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.SERVICE_NAME }}"
            ENV_FILE="$APP_DIR/.env"

            cd $APP_DIR

            # 롤백용 이전 태그 저장
            PREV_TAG=$(grep '^IMAGE_TAG=' "$ENV_FILE" 2>/dev/null | cut -d= -f2 || echo "latest")
            echo "Previous: $PREV_TAG → New: $NEW_TAG"

            # .env 업데이트
            if grep -q '^IMAGE_TAG=' "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$NEW_TAG|" "$ENV_FILE"
            else
              echo "IMAGE_TAG=$NEW_TAG" >> "$ENV_FILE"
            fi

            # 새 이미지 pull & 재시작
            docker compose pull $SERVICE
            docker compose up -d $SERVICE

            # Health check (15초 간격, 최대 5회)
            echo "Health check 시작..."
            for i in $(seq 1 5); do
              sleep 15
              if curl -sf "http://localhost:${{ vars.HEALTH_CHECK_PORT }}/actuator/health" > /dev/null; then
                echo "Health check 통과 (시도 $i)"
                exit 0
              fi
              echo "Health check 실패 ($i/5)"
            done

            # 롤백
            echo "배포 실패 — $PREV_TAG 로 롤백..."
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$PREV_TAG|" "$ENV_FILE"
            docker compose up -d $SERVICE
            sleep 15
            if curl -sf "http://localhost:${{ vars.HEALTH_CHECK_PORT }}/actuator/health" > /dev/null; then
              echo "롤백 성공"
            else
              echo "롤백도 실패"
            fi
            exit 1
