name: Generate OpenAPI Spec

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  generate-openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: goggles
          POSTGRES_USER: goggles
          POSTGRES_PASSWORD: goggles
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create mentoring schema
        run: PGPASSWORD=goggles psql -h localhost -U goggles -d goggles -c "CREATE SCHEMA IF NOT EXISTS mentoring;"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate OpenAPI Spec
        env:
          SPRING_PROFILES_ACTIVE: local
          SERVER_PORT: 8080
        run: ./gradlew generateOpenApiDocs --no-daemon -PGitHubPackagesUsername=${{ github.actor }} -PGitHubPackagesPassword=${{ secrets.GITHUB_TOKEN }}

      - name: Commit OpenAPI spec
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.yaml
          git diff --cached --quiet || git commit -m "docs: update openapi spec [skip ci]"
          git push
