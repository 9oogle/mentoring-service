          - PAYMENT_FAILED
          - ACCEPTED
          - REJECTED
          - CANCELED
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - SESSION_DATE_ASC
          - SESSION_DATE_DESC
          - CREATED_AT_ASC
          - CREATED_AT_DESC
      - name: pageRequest
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CommonPageRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommonPageResponseSummary"
    post:
      tags:
      - booking-controller
      operationId: createBooking
      parameters:
      - name: userContext
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/UserContext"
      requestBody:
        content:
