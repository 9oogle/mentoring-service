      operationId: cancelMentoringBooking
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Role
        in: header
        required: true
        schema:
          type: string
          enum:
          - STUDENT
          - INSTRUCTOR
          - MASTER
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cancellation"
