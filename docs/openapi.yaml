        required: true
      responses:
        "200":
          description: OK
  /internal/v1/mentoring-booking/payment-completed:
    patch:
      tags:
      - internal-mentoring-controller
      operationId: processMentoringBookingPaymentCompleted
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCompleted"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/mentorings/{mentoringId}:
    get:
      tags:
      - mentoring-controller
      operationId: getMentoring
      parameters:
      - name: mentoringId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Detail"
    delete:
      tags:
      - mentoring-controller
      operationId: deleteMentoring
      parameters:
      - name: userContext
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/UserContext"
      - name: mentoringId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - mentoring-controller
      operationId: updateMentoring
      parameters:
      - name: userContext
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/UserContext"
      - name: mentoringId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Update"
        required: true
      responses:
        "204":
          description: No Content
  /api/v1/mentorings/{mentoringId}/deactivate:
    patch:
      tags:
      - mentoring-controller
      operationId: deactivateMentoring
      parameters:
      - name: userContext
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/UserContext"
      - name: mentoringId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/mentoring-bookings/{bookingId}/sessions/{sessionId}/reschedule:
    patch:
      tags:
      - booking-controller
      operationId: rescheduleSession
      parameters:
      - name: userContext
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/UserContext"
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleSession"
        required: true
      responses:
        "204":
          description: No Content
  /api/v1/mentoring-bookings/{bookingId}/sessions/{sessionId}/complete:
    patch:
      tags:
      - booking-controller
      operationId: completeSession
      parameters:
      - name: userContext
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/UserContext"
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/admin/mentoring-categories/{categoryId}:
    delete:
      tags:
      - admin-controller
      operationId: deleteCategory
      parameters:
      - name: userContext
        in: query
        required: true
