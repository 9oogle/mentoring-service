language: "ko-KR"

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/generated/**"
    - "!**/*.generated.java"
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/resources/static/**"

  path_instructions:
    - path: "**/domain/**"
      instructions: |
        - Aggregate Root 외부 노출 여부
        - Aggregate 간 참조는 ID 기반인지
        - domain에 JPA/Spring 의존성 있는지

    - path: "**/application/**"
      instructions: |
        - Application Service가 orchestration만 하는지
        - @Transactional 위치가 적절한지

    - path: "**/*.java"
      instructions: |
        - 레이어 의존성 방향이 올바른지

chat:
  auto_reply: true